name: Bootstrap repo-auditor v1.0.0

on:
  push:
    branches: [main]
    paths:
      - ".repo-auditor-bootstrap/READY"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Expand verified source archive and publish v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-auditor-bootstrap/source.part-* > /tmp/repo-auditor-source.tar.gz.b64
          base64 -d /tmp/repo-auditor-source.tar.gz.b64 > /tmp/repo-auditor-source.tar.gz
          rm -rf /tmp/repo-auditor-source
          mkdir -p /tmp/repo-auditor-source
          tar -xzf /tmp/repo-auditor-source.tar.gz -C /tmp/repo-auditor-source
          rsync -a --delete --exclude='.git' /tmp/repo-auditor-source/repo-auditor/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish repo-auditor v1.0.0'
          git tag -a v1.0.0 -m 'repo-auditor v1.0.0'
          git push origin HEAD:main
          git push origin v1.0.0
