name: Portfolio Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "portfolio/**"
      - "audits/**"
      - "PORTFOLIO.md"
      - "POLICY.md"
      - "AUDIT_RUBRIC.md"
      - "scripts/audit_registry.py"
      - "scripts/audit_reports.py"
      - "scripts/collect_repo_evidence.py"
      - ".github/workflows/portfolio-audit.yml"
  pull_request:
    paths:
      - "portfolio/**"
      - "audits/**"
      - "PORTFOLIO.md"
      - "POLICY.md"
      - "AUDIT_RUBRIC.md"
      - "scripts/audit_registry.py"
      - "scripts/audit_reports.py"
      - "scripts/collect_repo_evidence.py"
      - ".github/workflows/portfolio-audit.yml"
  schedule:
    - cron: "17 1 1 * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Python audit tooling
        run: python -m py_compile scripts/audit_registry.py scripts/audit_reports.py scripts/collect_repo_evidence.py
      - name: Validate portfolio registry
        run: python scripts/audit_registry.py
      - name: Validate structured audit reports
        run: python scripts/audit_reports.py
