name: Portfolio Audit
on:
  workflow_dispatch:
    inputs:
      semantic_review:
        description: "Run optional L4 semantic review"
        required: true
        default: false
        type: boolean
      semantic_repository:
        description: "Repository to review (owner/name)"
        required: false
        default: "CochraneK/repo-auditor"
        type: string
      semantic_provider:
        description: "External provider preset"
        required: false
        default: "deepseek"
        type: choice
        options:
          - deepseek
          - glm
          - custom
      semantic_model:
        description: "Current provider model name"
        required: false
        default: ""
        type: string
      allow_private_repository:
        description: "Explicitly permit collecting a Private repository"
        required: true
        default: false
        type: boolean
      allow_private_external_ai:
        description: "Explicitly permit sending Private evidence to the selected external AI"
        required: true
        default: false
        type: boolean
  push:
    paths: ["portfolio/**", "audits/**", "PORTFOLIO.md", "POLICY.md", "AUDIT_RUBRIC.md", "AUDIT_MATURITY.md", "AGENTS.md", "HANDOFF.md", "STATUS.md", "DECISIONS.md", "AI_SEMANTIC_REVIEW.md", "scripts/**", "tests/**", "schemas/**", "skills/**", "docs/**", ".github/workflows/portfolio-audit.yml"]
  pull_request:
    paths: ["portfolio/**", "audits/**", "PORTFOLIO.md", "POLICY.md", "AUDIT_RUBRIC.md", "AUDIT_MATURITY.md", "AGENTS.md", "HANDOFF.md", "STATUS.md", "DECISIONS.md", "AI_SEMANTIC_REVIEW.md", "scripts/**", "tests/**", "schemas/**", "skills/**", "docs/**", ".github/workflows/portfolio-audit.yml"]
  schedule:
    - cron: "17 1 1 * *"
permissions: { contents: read }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/identity_audit.py . --json --fail-on-findings
      - run: python scripts/visual_ux_audit.py docs/index.html --json --fail-on-findings
      - run: python scripts/showcase_audit.py
      - run: python scripts/audit_registry.py
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python scripts/build_public_pages.py
      - run: python scripts/audit_reports.py
      - run: python scripts/remediation_queue.py
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python scripts/audit_freshness.py
      - run: node --check docs/app.js
      - run: python scripts/scan_portfolio.py --help
      - run: python scripts/repository_triage.py --help
      - run: python scripts/ai_readiness.py --help
      - run: python scripts/semantic_review.py --help
      - run: python scripts/semantic_review_summary.py --help
      - run: python scripts/scaffold_handoff.py --help
      - run: python scripts/meta_learning.py --help
      - run: python scripts/identity_audit.py --help
      - run: python scripts/build_readme_assets.py --out-dir /tmp/repo-auditor-readme-assets
      - run: python scripts/progress_report.py --out /tmp/PROGRESS_REPORT.md
      - run: python scripts/ai_native_migration_plan.py --help
      - run: python scripts/coverage_baseline.py --help
  sync-public-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: audit
    permissions: { contents: write }
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_AUDIT_TOKEN: "${{ secrets.PORTFOLIO_AUDIT_TOKEN }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Refresh privacy-safe account coverage summary
        if: env.PORTFOLIO_AUDIT_TOKEN != ''
        env: { GITHUB_TOKEN: "${{ env.PORTFOLIO_AUDIT_TOKEN }}" }
        run: |
          python scripts/scan_portfolio.py --allow-private
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/data/portfolio-overview.json").read_text())
          status=data.get("audit_status")
          reasons=(data.get("coverage") or {}).get("reasons") or []
          if status != "PASS":
              print("::warning::Private portfolio coverage is PARTIAL: " + "; ".join(reasons))
          else:
              print("Private portfolio coverage: PASS")
          PY
      - name: Report missing private-audit credential
        if: env.PORTFOLIO_AUDIT_TOKEN == ''
        run: echo "::warning::PORTFOLIO_AUDIT_TOKEN is not configured; preserving the last aggregate coverage snapshot."
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python scripts/build_public_pages.py
      - name: Refresh generated public progress surfaces
        run: |
          python scripts/build_readme_assets.py
          python scripts/progress_report.py
      - name: Commit privacy-safe Pages data
        run: |
          if git diff --quiet -- docs/data/registry.json docs/data/manifest.json docs/data/audits docs/data/todos.json docs/data/portfolio-overview.json docs/assets/readme PROGRESS_REPORT.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/registry.json docs/data/manifest.json docs/data/audits docs/data/todos.json docs/data/portfolio-overview.json docs/assets/readme PROGRESS_REPORT.md
          git commit -m 'chore: sync privacy-safe Pages bundle [skip ci]'
          git push
  private-portfolio-scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions: { contents: write }
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_AUDIT_TOKEN: "${{ secrets.PORTFOLIO_AUDIT_TOKEN }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Report missing account-wide credential
        if: env.PORTFOLIO_AUDIT_TOKEN == ''
        run: echo "::warning::PORTFOLIO_AUDIT_TOKEN is required for private-repository coverage; coverage remains external-blocked."
      - name: Scan account and generate triage
        if: env.PORTFOLIO_AUDIT_TOKEN != ''
        env: { GITHUB_TOKEN: "${{ env.PORTFOLIO_AUDIT_TOKEN }}" }
        run: |
          python scripts/scan_portfolio.py --allow-private
          python scripts/repository_triage.py private-evidence/portfolio-scan.json --out private-evidence/repository-triage.json
          python scripts/ai_native_migration_plan.py private-evidence/portfolio-scan.json --out private-evidence/ai-native-migration-plan.json
          python scripts/coverage_baseline.py private-evidence/portfolio-scan.json --kind lower-bound --out private-evidence/coverage-baseline-candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/data/portfolio-overview.json").read_text())
          status=data.get("audit_status")
          reasons=(data.get("coverage") or {}).get("reasons") or []
          if status != "PASS":
              print("::warning::Private portfolio coverage is PARTIAL: " + "; ".join(reasons))
          else:
              print("Private portfolio coverage: PASS")
          print("Private evidence and triage remain ephemeral and are never uploaded or committed.")
          PY
      - name: Publish aggregate coverage only
        if: env.PORTFOLIO_AUDIT_TOKEN != ''
        run: |
          python scripts/build_readme_assets.py
          python scripts/progress_report.py
          if git diff --quiet -- docs/data/portfolio-overview.json docs/assets/readme PROGRESS_REPORT.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/portfolio-overview.json docs/assets/readme PROGRESS_REPORT.md
          git commit -m 'chore: refresh aggregate audit coverage [skip ci]'
          git push

  semantic-review:
    if: github.event_name == 'workflow_dispatch' && inputs.semantic_review == true
    permissions: { contents: read }
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_AUDIT_TOKEN: "${{ secrets.PORTFOLIO_AUDIT_TOKEN }}"
      DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"
      ZHIPU_API_KEY: "${{ secrets.ZHIPU_API_KEY }}"
      AI_REVIEW_API_KEY: "${{ secrets.AI_REVIEW_API_KEY }}"
      AI_REVIEW_BASE_URL: "${{ secrets.AI_REVIEW_BASE_URL }}"
      AI_REVIEW_MODEL: "${{ inputs.semantic_model }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate semantic-review request
        env:
          SEMANTIC_MODEL: "${{ inputs.semantic_model }}"
        run: |
          if [ -z "$SEMANTIC_MODEL" ]; then
            echo "::error::semantic_model is required when semantic_review=true"
            exit 2
          fi
      - name: Collect repository evidence
        env:
          GITHUB_TOKEN: "${{ secrets.PORTFOLIO_AUDIT_TOKEN || github.token }}"
          TARGET_REPOSITORY: "${{ inputs.semantic_repository }}"
          ALLOW_PRIVATE_REPOSITORY: "${{ inputs.allow_private_repository }}"
        run: |
          flags=""
          if [ "$ALLOW_PRIVATE_REPOSITORY" = "true" ]; then
            flags="--allow-private"
          fi
          python scripts/collect_repo_evidence.py "$TARGET_REPOSITORY" $flags --out private-evidence/manual-semantic-evidence.json
      - name: Run L4 semantic review
        env:
          SEMANTIC_PROVIDER: "${{ inputs.semantic_provider }}"
          ALLOW_PRIVATE_EXTERNAL_AI: "${{ inputs.allow_private_external_ai }}"
        run: |
          flags=""
          if [ "$ALLOW_PRIVATE_EXTERNAL_AI" = "true" ]; then
            flags="--allow-private-external-ai"
          fi
          python scripts/semantic_review.py private-evidence/manual-semantic-evidence.json \
            --provider "$SEMANTIC_PROVIDER" \
            --out private-evidence/manual-semantic-review.json \
            $flags
      - name: Write privacy-safe workflow summary
        run: |
          python scripts/semantic_review_summary.py \
            private-evidence/manual-semantic-evidence.json \
            private-evidence/manual-semantic-review.json >> "$GITHUB_STEP_SUMMARY"
      - name: Generate meta-learning candidates
        run: |
          visibility="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("private-evidence/manual-semantic-evidence.json").read_text())
          print("private" if data.get("visibility") == "private" else "public")
          PY
          )"
          python scripts/meta_learning.py private-evidence/manual-semantic-review.json \
            --source-visibility "$visibility" \
            --out private-evidence/manual-meta-candidates.json
          echo "Semantic evidence, full review, and candidate details remain ephemeral on the runner." >> "$GITHUB_STEP_SUMMARY"
