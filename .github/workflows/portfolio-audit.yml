name: Portfolio Audit
on:
  workflow_dispatch:
  push:
    paths: ["portfolio/**", "audits/**", "PORTFOLIO.md", "POLICY.md", "AUDIT_RUBRIC.md", "scripts/**", "tests/**", "docs/**", ".github/workflows/portfolio-audit.yml"]
  pull_request:
    paths: ["portfolio/**", "audits/**", "PORTFOLIO.md", "POLICY.md", "AUDIT_RUBRIC.md", "scripts/**", "tests/**", "docs/**", ".github/workflows/portfolio-audit.yml"]
  schedule:
    - cron: "17 1 1 * *"
permissions: { contents: read }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/visual_ux_audit.py docs/index.html --json --fail-on-findings
      - run: python scripts/audit_registry.py
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python scripts/build_public_pages.py
      - run: python scripts/audit_reports.py
      - run: python scripts/remediation_queue.py
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python scripts/audit_freshness.py
      - run: node --check docs/app.js
      - run: python scripts/scan_portfolio.py --help
      - run: python scripts/repository_triage.py --help
  sync-public-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: audit
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python scripts/build_public_pages.py
      - run: |
          if git diff --quiet -- docs/data/registry.json docs/data/manifest.json docs/data/audits; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/registry.json docs/data/manifest.json docs/data/audits; git commit -m 'chore: sync privacy-safe Pages bundle [skip ci]'; git push
  private-portfolio-scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_AUDIT_TOKEN: "${{ secrets.PORTFOLIO_AUDIT_TOKEN }}"
      PORTFOLIO_EXPECTED_TOTAL: "42"
      PORTFOLIO_EXPECTED_PRIVATE: "9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require account-wide credential
        if: env.PORTFOLIO_AUDIT_TOKEN == ''
        run: |
          echo '::error::PORTFOLIO_AUDIT_TOKEN is required for full account coverage.'
          exit 2
      - name: Scan all owned repositories and require complete coverage
        if: env.PORTFOLIO_AUDIT_TOKEN != ''
        env: { GITHUB_TOKEN: "${{ env.PORTFOLIO_AUDIT_TOKEN }}" }
        run: |
          python scripts/scan_portfolio.py --allow-private --require-complete
          python scripts/repository_triage.py private-evidence/portfolio-scan.json --out private-evidence/repository-triage.json
          echo 'Private evidence and triage remain ephemeral and are never uploaded or committed.'
